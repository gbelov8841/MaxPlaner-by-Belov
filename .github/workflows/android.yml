name: Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Test planner and build debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CI-debug-not-for-installation
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: planner-test-results
          path: app/build/test-results/testDebugUnitTest

  interaction:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise native screens and capture all themes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/device-tests.sh
      - name: Prepare visual review previews
        if: always()
        run: |
          python3 -m pip install Pillow
          python3 .github/scripts/preview-evidence.py
      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: planner-ui-evidence
          path: |
            ui-screenshots
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
